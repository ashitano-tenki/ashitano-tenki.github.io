<style>
/* 試作ページ（アーティファクト）の土台と同じ指定 */
body { margin: 0; }
[hidden] { display: none !important; }
</style>
<style>
/* 黒田悠介デザインシステム準拠。白地に空色、差し色に黄色、文字は黒。1画面1カラム、質問は1問ずつ */
:root {
  --ck-base: #fbfaf5;
  --ck-base-yellow: #fff3c4;
  --ck-ink: #1a1d23;
  --ck-sky: #1874b8;
  --ck-sky-bright: #2f95d6;
  --ck-yellow: #f5c518;
  --ck-text-body: #4a4f57;
  --ck-text-sub: #5e636b;
  --ck-text-on-ink: #d6d9de;
  --ck-line: #e3e6ea;
  --ck-card: #ffffff;
  --ck-font-display: "Zen Kaku Gothic New", "Noto Sans JP", "Hiragino Sans", sans-serif;
  --ck-font-sans: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
  --ck-radius-sm: 4px; --ck-radius-md: 8px; --ck-radius-lg: 16px; --ck-radius-pill: 999px;
  --ck-shadow-card: 0 1px 2px rgba(26, 29, 35, 0.06);
  --ck-primary-hover: #2c313a;
  --ck-hero-bg: #1a1d23;      /* 結果の帯（明るい表示でも暗い表示でも暗い地に黄色） */
  --ck-hero-fg: #fbfaf5;
  --ck-node-on-bg: #1a1d23;   /* サイクル図のいまの段階 */
  --ck-node-on-fg: #f5c518;
  color-scheme: light;
}
/* ダーク表示（フッターのボタンで切り替え）。観測所のほかのページと同じ配色 */
:root[data-theme="dark"] {
  --ck-base: #15181d;
  --ck-base-yellow: #3a3320;
  --ck-ink: #f3f1ea;
  --ck-sky: #7cc0ee;
  --ck-sky-bright: #4aa8e4;
  --ck-text-body: #c9cdd3;
  --ck-text-sub: #a3a9b1;
  --ck-line: #313640;
  --ck-card: #1f232a;
  --ck-shadow-card: 0 1px 2px rgba(0, 0, 0, 0.4);
  --ck-primary-hover: #ffffff;
  --ck-hero-bg: #0e1013;
  --ck-node-on-bg: #f5c518;
  --ck-node-on-fg: #15181d;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--ck-base);
  color: var(--ck-ink);
  font-family: var(--ck-font-sans);
  font-size: 16px;
  line-height: 1.8;
  -webkit-font-smoothing: antialiased;
}
.ck-wrap {
  max-width: 960px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 64px;
}
/* 左端はほかのページ（幅960pxの枠）とそろえ、読みやすい行の長さ（680px）は保つ */
.ck-wrap > * { max-width: 680px; }
.band { position: fixed; top: 0; bottom: 0; left: 0; width: 8px; background: var(--ck-yellow); }
@media (max-width: 720px) { .band { display: none; } }
.label {
  font-size: 13px; font-weight: 700; letter-spacing: 0.12em;
  color: var(--ck-sky); text-transform: uppercase; margin: 0;
}
h1, h2, h3 { font-family: var(--ck-font-display); text-wrap: balance; word-break: auto-phrase; margin: 0; }
h1 { font-size: clamp(30px, 7vw, 40px); line-height: 1.35; font-weight: 900; }
h2 { font-size: clamp(24px, 5.4vw, 32px); line-height: 1.4; font-weight: 700; }
h3 { font-size: 20px; line-height: 1.5; font-weight: 700; }
p { margin: 0; }
.lead { color: var(--ck-text-body); }
.small { font-size: 13px; line-height: 1.7; color: var(--ck-text-sub); }
.stack { display: flex; flex-direction: column; gap: 16px; }
.stack-lg { display: flex; flex-direction: column; gap: 48px; }
.card {
  background: var(--ck-card); border: 1px solid var(--ck-line);
  border-radius: var(--ck-radius-md); box-shadow: var(--ck-shadow-card);
  padding: 24px;
}
.btn {
  appearance: none; border: 0; cursor: pointer;
  font: 700 16px/1.4 var(--ck-font-sans);
  border-radius: var(--ck-radius-md); padding: 14px 28px;
}
.btn-primary { background: var(--ck-ink); color: var(--ck-base); }
.btn-primary:hover { background: var(--ck-primary-hover); }
.btn-ghost { background: transparent; color: var(--ck-sky); padding: 10px 4px; text-decoration: underline; text-underline-offset: 3px; }
.btn:focus-visible, .opt:focus-visible, a:focus-visible { outline: 2px solid var(--ck-sky); outline-offset: 2px; }
a { color: var(--ck-sky); text-underline-offset: 3px; }
[tabindex="-1"]:focus { outline: none; }

/* サイクル図 */
.cycle { width: 100%; max-width: 360px; height: auto; display: block; margin: 0 auto; }
.cycle text { font-family: var(--ck-font-display); }

/* 冒頭 */
.meta { display: flex; flex-wrap: wrap; gap: 8px; }
.tag {
  font-size: 13px; font-weight: 700; color: var(--ck-ink);
  border: 1px solid var(--ck-ink); border-radius: var(--ck-radius-pill); padding: 2px 12px;
}
.stage-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.stage-list div { min-width: 0; }
.stage-list b { font-family: var(--ck-font-display); font-size: 18px; display: block; }
.stage-list span { font-size: 14px; color: var(--ck-text-body); line-height: 1.6; display: block; }
@media (max-width: 440px) { .stage-list { grid-template-columns: 1fr; } }

/* 質問 */
.progress { height: 4px; background: var(--ck-line); border-radius: var(--ck-radius-pill); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--ck-sky-bright); transition: width .25s ease; }
.qhead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.qcount { font-size: 13px; color: var(--ck-text-sub); font-variant-numeric: tabular-nums; }
.qtext { word-break: auto-phrase; font-family: var(--ck-font-display); font-weight: 700; font-size: clamp(21px, 5vw, 26px); line-height: 1.55; text-wrap: balance; min-height: calc(2 * 1.55em); display: flex; align-items: flex-end; }
@media (max-width: 560px) { .qtext { min-height: calc(3 * 1.55em); } }
/* 選択肢の文の長さがちがっても、同じ質問のボタンは同じ高さにそろえる */
.opts { display: grid; grid-auto-rows: 1fr; gap: 10px; }
.opt {
  appearance: none; text-align: left; cursor: pointer; width: 100%;
  font: 500 16px/1.6 var(--ck-font-sans); color: var(--ck-ink);
  background: var(--ck-card); border: 1px solid var(--ck-line); border-radius: var(--ck-radius-md);
  padding: 14px 18px; box-shadow: var(--ck-shadow-card);
  transition: border-color .15s ease;
}
.opt:hover { border-color: var(--ck-sky-bright); }
.opt[aria-pressed="true"] { border-color: var(--ck-ink); box-shadow: inset 0 0 0 1px var(--ck-ink); font-weight: 700; }
.scale { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.scale .opt { text-align: center; padding: 14px 6px; font-size: 14px; line-height: 1.5; }
@media (max-width: 480px) { .scale { grid-template-columns: 1fr; } .scale .opt { text-align: left; padding: 14px 18px; font-size: 16px; } }
.qnav { display: flex; justify-content: space-between; align-items: center; min-height: 44px; }

/* 結果 */
.result-hero {
  background: var(--ck-hero-bg); color: var(--ck-hero-fg);
  border-radius: var(--ck-radius-lg); padding: 32px 24px;
  display: flex; flex-direction: column; gap: 12px;
}
.result-hero .label { color: var(--ck-yellow); }
.result-hero .stage-name { font-family: var(--ck-font-display); font-weight: 900; font-size: clamp(48px, 14vw, 72px); line-height: 1.1; color: var(--ck-yellow); }
.result-hero p { color: var(--ck-text-on-ink); }
.bars { display: flex; flex-direction: column; gap: 10px; }
.bar { display: grid; grid-template-columns: 3.5em minmax(0, 1fr) 2.5em; gap: 12px; align-items: center; font-variant-numeric: tabular-nums; }
.bar b { font-family: var(--ck-font-display); }
.bar .track { height: 10px; background: var(--ck-line); border-radius: var(--ck-radius-pill); overflow: hidden; }
.bar .track i { display: block; height: 100%; background: var(--ck-sky-bright); border-radius: var(--ck-radius-pill); }
.bar.on .track i { background: var(--ck-ink); }
.bar span { font-size: 13px; color: var(--ck-text-sub); text-align: right; }
.steps { margin: 0; padding-left: 1.4em; display: flex; flex-direction: column; gap: 8px; color: var(--ck-text-body); }
.steps li::marker { color: var(--ck-sky); font-weight: 700; }
.rule { border: 0; border-top: 2px solid var(--ck-ink); margin: 0; }
.picks { display: flex; flex-direction: column; gap: 12px; }
.pick { display: flex; flex-direction: column; padding: 0; overflow: hidden; }
.pick .card-media { border-width: 0 0 1px; }
.pick-body { display: flex; flex-direction: column; gap: 6px; min-width: 0; padding: 20px 24px 24px; }
.pick-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.pick-type { font-size: 12px; font-weight: 700; color: var(--ck-sky); border: 1px solid var(--ck-sky); border-radius: var(--ck-radius-pill); padding: 0 10px; }
.pick h3 { font-size: 18px; }
.pick p { font-size: 15px; color: var(--ck-text-body); line-height: 1.7; }
.links { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 480px) { .links { grid-template-columns: 1fr; } }
.linkcard { display: flex; flex-direction: column; gap: 4px; text-decoration: none; color: var(--ck-ink); }
.linkcard:hover { border-color: var(--ck-sky-bright); }
.linkcard b { font-family: var(--ck-font-display); font-size: 18px; }
.linkcard span { font-size: 14px; color: var(--ck-text-body); line-height: 1.6; }
.share { display: flex; flex-wrap: wrap; gap: 10px; }
.share a, .share button {
  font: 700 15px/1.4 var(--ck-font-sans); text-decoration: none; cursor: pointer;
  color: var(--ck-ink); background: var(--ck-card); border: 1px solid var(--ck-ink);
  border-radius: var(--ck-radius-md); padding: 10px 18px;
}
.share-text { white-space: pre-line; overflow-wrap: anywhere; font-size: 14px; color: var(--ck-text-body); background: var(--ck-card); border: 1px dashed var(--ck-line); border-radius: var(--ck-radius-sm); padding: 12px; user-select: all; }
footer { border-top: 1px solid var(--ck-line); padding-top: 24px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* 観測所のスタイル（style.css）がセルフチェックの部品に効かないように打ち消す */
#app .card a { display: inline; height: auto; background: none; border: 0; box-shadow: none; padding: 0; color: var(--ck-sky); text-decoration: underline; }
#app a.card.linkcard { display: flex; flex-direction: column; gap: 4px; text-decoration: none; color: var(--ck-ink); }
#app .card h3 { padding-right: 0; }
/* 共通のヘッダーとフッターは、ほかのページと同じ書体で */
.site-header, .site-footer { font-family: var(--font-sans); }
#app .tag { background: transparent; line-height: 1.8; }
/* 質問に答えているあいだは、ヘッダーをロゴだけにして回答に集中できるようにする（フッターも隠す） */
.in-question .global-nav, .in-question .header-search-btn, .in-question .menu-btn, .in-question .header-search, .in-question .site-footer { display: none !important; }
/* 前回の結果・準備のなかの位置・4つの資源・相談メモ・印刷 */
.prev-note { font-size: 14px; color: var(--ck-ink); background: var(--ck-base-yellow); border-radius: 8px; padding: 8px 12px; margin: 0; }
.sub-steps { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin: 4px 0 8px; }
.sub-steps span { font-size: 13px; padding: 3px 12px; border-radius: var(--ck-radius-pill); border: 1px solid var(--ck-text-on-ink-sub, #9aa0a8); color: var(--ck-text-on-ink); }
.sub-steps .on { background: var(--ck-yellow); border-color: var(--ck-yellow); color: var(--ck-ink); font-weight: 700; }
.gentle { margin: 0; padding: 14px 16px; border-left: 4px solid var(--ck-sky); background: var(--ck-card); border-radius: 8px; color: var(--ck-ink); }
.common { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 6px; color: var(--ck-text-body); }
.s4 { display: flex; flex-direction: column; gap: 12px; }
.s4-row { display: grid; grid-template-columns: 3em minmax(0, 1fr) 4.5em; gap: 2px 12px; align-items: center; }
.s4-row b { font-family: var(--ck-font-display); }
.s4-row .track { height: 10px; background: var(--ck-line); border-radius: var(--ck-radius-pill); overflow: hidden; }
.s4-row .track i { display: block; height: 100%; background: var(--ck-sky-bright); border-radius: var(--ck-radius-pill); }
.s4-row.low .track i { background: var(--ck-yellow); }
.s4-row .lv { font-size: 13px; color: var(--ck-text-sub); }
.s4-row.low .lv { color: var(--ck-ink); font-weight: 700; }
.s4-short { grid-column: 2 / -1; font-size: 12px; color: var(--ck-text-sub); }
.memo { white-space: pre-line; overflow-wrap: anywhere; font-size: 14px; line-height: 1.8; color: var(--ck-ink); background: var(--ck-card); border: 1px dashed var(--ck-text-sub); border-radius: 10px; padding: 14px 16px; margin: 0; }
.share button:disabled { opacity: .6; cursor: default; }
@media print {
  .site-header, .site-footer, .skip-link, .band, .no-print, #observatory { display: none !important; }
  .result-hero { background: none !important; border: 1px solid #000; }
  .result-hero p, .result-hero .stage-name { color: #000 !important; }
}
</style>
</head>
