name: サイトを更新

on:
  schedule:
    - cron: "0 20 * * *"   # 毎日 日本時間の朝5時ごろ（UTCの20時）
  workflow_dispatch:
    inputs:
      allow_decrease:
        description: "件数が前回の半分未満に減っても公開する（データを意図して減らしたときだけ）"
        type: boolean
        default: false
  push:
    branches: [main]

# 権限は作業ごとに分ける（作る側は記録の保存だけ、公開する側は GitHub Pages への公開だけ）
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # 環境の版を固定する（標準の ubuntu-latest が新しい版に切り替わっても、画像の処理や読み仮名の部品が動くように）
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # 件数とデータの記録を保存するため
      pages: read       # 公開先の設定を読むため（configure-pages）
      issues: write     # サイトの点検で問題があったとき Issue で知らせるため
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      # 掲載先の公式ページからシェア用の画像を取得して縮小する（新しい掲載と、取得から日がたったものだけ。1回150件まで）。
      # 画像の縮小に Pillow を使う。ここで失敗しても、前回までの画像のままサイトの更新は続ける
      - name: 掲載先の画像を取得する
        continue-on-error: true
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet --disable-pip-version-check "pillow==11.3.0" "pykakasi==2.3.0"
          .venv/bin/python tools/fetch_images.py

      # 紹介ページごとの共有画像（タイトル・タイプ・転機を載せた 1200×630）を作る。失敗しても観測所共通の画像のまま更新は続ける
      - name: 紹介ページの共有画像を作る
        continue-on-error: true
        run: .venv/bin/python tools/make_item_og.py

      # 検索用のデータに漢字の読みを入れる（ひらがなでも探せるように）ため、pykakasi の入った .venv の Python で作る。
      # .venv が作れなかったときは、ふつうの python3 で作る（ひらがな検索ができないだけで、サイトの更新は続く）
      # CSVの取得に失敗したとき、0件のとき、前回の半分未満のときは、ここで止まり公開しない（前回のサイトがそのまま残る）
      - name: CSVを読み込んでサイトを作る
        run: |
          PY=python3
          if [ -x .venv/bin/python ]; then PY=.venv/bin/python; fi
          if [ "${{ inputs.allow_decrease }}" = "true" ]; then
            $PY build.py --save-data --allow-decrease
          else
            $PY build.py --save-data
          fi

      # 作ったサイトを点検する（サイト内のリンク切れ・画像の抜け・見出しの飛びなど）。
      # 問題があっても公開は止めず、Issue で知らせる（同じ日に何度作り直しても、開いている点検の Issue は1つだけにする）
      - name: 作ったサイトを点検する
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/check_site.py site-report.md
          TITLE="サイトの自動点検で問題が見つかりました"
          OPEN=$(gh issue list --repo "${{ github.repository }}" --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number')
          if [ -f site-report.md ]; then
            if [ -n "$OPEN" ]; then gh issue edit "$OPEN" --repo "${{ github.repository }}" --body-file site-report.md
            else gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body-file site-report.md; fi
          elif [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "${{ github.repository }}" --comment "$(TZ=Asia/Tokyo date +%F) の点検では問題がなくなりました。"
          fi

      # 件数の記録（data/meta.json）と、読み込んだデータそのもの（data/latest.csv）を残す。
      # meta.json は次回の件数チェックに、latest.csv は何がいつ変わったかの履歴に使う。毎日の記録が続くことで自動実行も止まらない
      - name: 件数とデータの記録を保存する
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/meta.json data/latest.csv data/project.csv data/voices.csv data/images.json images/items
          git diff --cached --quiet || git commit -m "サイト更新の記録 $(date -u +%F)"
          git push

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.first.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      # GitHub 側の公開の段階は、ときどき時間切れで失敗する。失敗したら1分おいて、もう一度だけ試す
      - id: first
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5
      - name: 公開に失敗したので1分待つ
        if: steps.first.outcome == 'failure'
        run: sleep 60
      - id: retry
        if: steps.first.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5
